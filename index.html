<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Merge Tool</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>PDF Merge Tool</h1>
    <p class="subtitle">Merge multiple PDF files entirely in your browser. Nothing is uploaded anywhere.</p>
  </header>

  <main>
    <div id="dropzone" class="dropzone">
      <p>Drag &amp; drop PDF files here, or</p>
      <label for="file-input" class="button">Choose Files</label>
      <input type="file" id="file-input" accept="application/pdf" multiple hidden>
    </div>

    <ul id="file-list" class="file-list"></ul>

    <div class="actions">
      <button id="merge-btn" class="button primary" disabled>Merge PDFs</button>
      <button id="clear-btn" class="button secondary" disabled>Clear All</button>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <footer>
    <p>All processing happens locally on your device. Your files never leave your computer.</p>
  </footer>
</div>

<script src="vendor/pdf-lib.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
